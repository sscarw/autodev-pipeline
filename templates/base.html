<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDev</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.5 19a4.5 4.5 0 0 1-.4-8.98 6 6 0 0 1 11.53-2.19A4.5 4.5 0 0 1 17.5 19h-11z" fill="white"/>
                        <path d="M12.5 9.5 9.8 13h1.9l-.7 3 2.9-3.7h-2l.6-2.8z" fill="#2F6BFF"/>
                    </svg>
                </span>
                <span class="brand-name">AutoDev</span>
            </div>
            <nav class="nav">
                <a href="/" class="nav-link {{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
                <a href="/settings" class="nav-link {{ 'active' if request.url.path == '/settings' else '' }}">Settings</a>
            </nav>
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
